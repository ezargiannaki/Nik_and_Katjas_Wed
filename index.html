<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Νικόλας & Αικατερίνη</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="page">

    <div class="instruction" id="instruction">
      Αγγίξτε το κοχύλι
    </div>

    <div class="shell" id="shell">

      <!-- ΚΛΕΙΣΤΟ -->
      <img
        src="./images/shell-closed.png"
        class="shell-closed"
        alt="Κλειστό κοχύλι"
      >
    
      <!-- ΑΝΟΙΧΤΟ -->
      <div class="open-shell">
    
        <img
          src="./images/shell-open.png"
          class="shell-open-image"
          alt="Ανοιχτό κοχύλι"
        >
    
        <!-- ΚΕΙΜΕΝΟ ΣΤΟ ΠΑΝΩ ΦΥΛΛΟ -->
        <div class="shell-content">
    
          <div class="ornament">✧</div>
    
          <div class="names">
            <div>Νικόλας</div>
            <span>&</span>
            <div>Αικατερίνη</div>
          </div>
    
          <div class="divider">♡</div>
    
          <div class="date">
            18.09.2027
          </div>
    
        </div>
    
        <!-- ΚΟΥΜΠΙ ΣΤΟ ΚΑΤΩ ΦΥΛΛΟ -->
        <a
          href="#"
          class="upload-button"
          id="uploadButton"
        >
          📷
          <span>Ανεβάστε τις φωτογραφίες σας</span>
        </a>
    
      </div>
    
    </div>

    </div>

  </main>


  <script src="./script.js"></script>

</body>

</html>
