<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Απόστολης & Ειρήνη</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <div class="instruction" id="instruction">
      Αγγίξτε το κοχύλι
    </div>


    <div class="shell" id="shell">

      <!-- ΚΛΕΙΣΤΟ ΚΟΧΥΛΙ -->
      <img
        src="images/shell-closed.jpg"
        class="shell-closed"
        alt="Κλειστό κοχύλι"
      >


      <!-- ΑΝΟΙΧΤΟ ΚΟΧΥΛΙ -->

      <div class="open-shell">

        <!-- ΠΑΝΩ ΜΕΡΟΣ -->
        <img
          src="images/shell-top.jpg"
          class="shell-top"
          alt=""
        >


        <!-- ΚΑΤΩ ΜΕΡΟΣ -->
        <div class="shell-bottom-wrapper">

          <img
            src="images/shell-bottom.jpg"
            class="shell-bottom"
            alt=""
          >


          <!-- ΚΕΙΜΕΝΟ -->

          <div class="shell-content">

            <div class="names">

              <div>Νικόλας</div>

              <span>&</span>

              <div>Αικατερίνη</div>

            </div>


            <div class="divider">
              ♡
            </div>


            <div class="date">
              18.09.2027
            </div>


            <a
              href="#"
              class="upload-button"
              id="uploadButton"
            >
              📷
              <span>Ανεβάστε τις φωτογραφίες σας</span>
            </a>

          </div>

        </div>

      </div>

    </div>

  </main>


  <script src="script.js"></script>

</body>

</html>
